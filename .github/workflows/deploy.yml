name: Build and deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    # Pull requests only build. Pushes to main publish through the runner on ec2-scailable.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, x64, adbilliards]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install release and switch symlink
        env:
          ROOT: /var/www/adbilliards
        run: |
          RELEASE="$ROOT/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          mkdir -p "$RELEASE"
          rsync -a --delete dist/ "$RELEASE/"
          # Atomic switch, then keep the 5 newest releases for quick rollback.
          # Sort by name (UTC timestamp prefix): rsync -a copies the artifact's
          # mtime onto the folder, so mtime order isn't deploy order.
          ln -sfn "$RELEASE" "$ROOT/current.tmp"
          mv -T "$ROOT/current.tmp" "$ROOT/current"
          ls -1d "$ROOT"/releases/* | sort -r | tail -n +6 | xargs -r rm -rf

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        if: env.SITE_URL != ''
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "$SITE_URL"
